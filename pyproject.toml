[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deflate"
version = "0.1.0"
description = "The backtest lie detector: detect overfit trading-strategy backtests (Deflated Sharpe, PBO, bootstrap, placebo)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "deflate contributors" }]
keywords = [
    "backtesting",
    "overfitting",
    "deflated-sharpe",
    "pbo",
    "quant",
    "trading",
    "finance",
    "bootstrap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "pandas>=1.4",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/raphael2025/deflate"
Repository = "https://github.com/raphael2025/deflate"
Issues = "https://github.com/raphael2025/deflate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deflate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
